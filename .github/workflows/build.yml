name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # 失敗時、コンパイルエラーをまとめて注釈として表示する
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |^w: .*error|What went wrong" -A4 build.log | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoomSketch.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RoomSketch.apk \
            --title "最新ビルド" \
            --notes "コミット ${GITHUB_SHA::7} からビルドしたAPKです。RoomSketch.apk をスマホでダウンロードしてインストールしてください。"
